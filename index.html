<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SirverData Chat</title>
    <meta name="description" content="Sirver cross-platform chat application with real-time direct calls, audio/video channels, admin theme management, and rich messaging" />
    <meta name="keywords" content="Sirver, SirverData, chat, voice channels, video call, real-time messaging, pocketbase" />
    <meta name="author" content="SirverData" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.sirverdata.top/" />
    <meta property="og:site_name" content="SirverData" />
    <meta property="og:title" content="SirverData Chat" />
    <meta property="og:description" content="Sirver cross-platform chat application with real-time direct calls, audio/video channels, admin theme management, and rich messaging" />
    <meta property="og:image" content="https://app.sirverdata.top/og-preview.png" />
    <meta property="og:image:secure_url" content="https://app.sirverdata.top/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SirverData Chat - Real-time Chat, Voice & Video" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://app.sirverdata.top/" />
    <meta name="twitter:title" content="SirverData Chat" />
    <meta name="twitter:description" content="Sirver cross-platform chat application with real-time direct calls, audio/video channels, admin theme management, and rich messaging" />
    <meta name="twitter:image" content="https://app.sirverdata.top/og-preview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var mode = 'dark';
          var useThemes = false;
          var userSettings = localStorage.getItem('sirver_user_settings_cache_v2');
          if (userSettings) {
            var parsed = JSON.parse(userSettings);
            if (parsed && parsed.appearance) {
              if (parsed.appearance.theme === 'light') mode = 'light';
              else if (parsed.appearance.theme === 'dark') mode = 'dark';
              else if (parsed.appearance.theme === 'system') {
                mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
              }
              if (typeof parsed.appearance.useThemes === 'boolean') {
                useThemes = parsed.appearance.useThemes;
              }
            }
          } else {
            var savedMode = localStorage.getItem('sirver_theme_mode');
            if (savedMode === 'light' || savedMode === 'dark') mode = savedMode;
            var savedUseThemes = localStorage.getItem('sirver_use_themes_enabled');
            if (savedUseThemes === 'true') useThemes = true;
          }

          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(mode);
          root.setAttribute('data-theme-mode', mode);
          root.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pre-hydration-loader" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; width:100vw; background:#090d14; color:#f8fafc; font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="position:relative; width:72px; height:72px; display:flex; align-items:center; justify-content:center;">
          <div style="position:absolute; width:100%; height:100%; border-radius:20px; background:#7BAE37; opacity:0.25; filter:blur(12px); animation:pulseGlow 2s infinite ease-in-out;"></div>
          <img src="/apple-touch-icon.png" alt="Sirver" style="width:48px; height:48px; border-radius:14px; z-index:1; box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);" />
        </div>
        <div style="margin-top:16px; font-weight:800; letter-spacing:0.15em; font-size:18px; color:#ffffff;">SIRVER</div>
        <div style="margin-top:4px; font-size:12px; color:#64748b; letter-spacing:0.05em;">Loading application...</div>
        <style>
          @keyframes pulseGlow {
            0%, 100% { transform: scale(0.95); opacity: 0.2; }
            50% { transform: scale(1.15); opacity: 0.45; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
