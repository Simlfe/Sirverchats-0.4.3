name: Build and Deploy Windows App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            Remove-Item -Force "package-lock.json"
          }
          npm install
          npm install --no-save @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc @esbuild/win32-x64

      - name: Build Web Assets
        run: npm run build

      - name: Build Windows Executable & Installer
        shell: pwsh
        run: |
          $signKey = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          $signPass = "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          if ($signKey -and $signKey.Trim() -ne "") {
            Write-Host "Signing key detected. Building signed Windows installer..."
            $env:TAURI_SIGNING_PRIVATE_KEY = $signKey
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $signPass
            npx tauri build --ci
          } else {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY secret detected. Building unsigned Windows installer (--no-sign)..."
            npx tauri build --ci --no-sign
          }

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SirverData-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Attach Installers to GitHub Release (on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

