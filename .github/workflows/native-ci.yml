name: Tauri cross-platform CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    name: React typecheck, tests, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build React web assets
        run: npm run build

      - name: Verify bundle budget
        run: npm run check:bundle

      - name: Upload React web artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-react-web
          path: dist
          if-no-files-found: error

  gateway-quality:
    name: API gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api-v2/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run gateway unit tests
        run: npm test

  android:
    name: Tauri Android APK
    needs: [web-quality, gateway-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri Android debug APK
        run: npx tauri android build --ci --debug --apk --target aarch64

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-tauri-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  windows:
    name: Tauri Windows release build
    needs: [web-quality, gateway-quality]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri Windows installer
        run: npx tauri build --ci --no-sign --bundles nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-tauri-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Tauri Linux AppImage and deb
    needs: [web-quality, gateway-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev squashfs-tools \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri Linux packages
        run: npx tauri build --ci --no-sign --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-tauri-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
