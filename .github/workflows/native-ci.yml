name: Native Flutter CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  native-quality:
    name: Flutter format, analysis, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit, widget, and integration tests
        run: flutter test

  gateway-quality:
    name: API gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api-v2/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run gateway unit tests
        run: npm test

  web:
    name: Flutter Web release build
    needs: native-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Add Pages SPA fallback and cache headers
        working-directory: .
        run: |
          cp native/web/_redirects native/build/web/_redirects
          cp native/web/_headers native/build/web/_headers

      - name: Enforce measured Web JS/Wasm baseline
        working-directory: .
        run: |
          export FLUTTER_WEB_BASELINE_KIB="$(cat native/tool/flutter_web_baseline_kib)"
          node native/tool/check_web_bundle.mjs

      - name: Upload Flutter Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-native-web
          path: native/build/web
          if-no-files-found: error

  android:
    name: Android APK and AAB
    needs: native-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name=0.5.0 --build-number=${{ github.run_number }}

      - name: Build release AAB
        run: flutter build appbundle --release --build-name=0.5.0 --build-number=${{ github.run_number }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-native-android
          path: |
            native/build/app/outputs/flutter-apk/app-release.apk
            native/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Windows desktop release build
    needs: native-quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=0.5.0 --build-number=${{ github.run_number }}

      - name: Create Windows archive
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/sirverdata-desktop-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-native-windows
          path: native/build/sirverdata-desktop-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux AppImage, deb, and archive
    needs: native-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build and packaging dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libfuse2t64 squashfs-tools dpkg-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release --build-name=0.5.0 --build-number=${{ github.run_number }}

      - name: Install AppImage tool
        working-directory: .
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Package Linux artifacts
        working-directory: .
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash native/tool/package-linux.sh 0.5.0

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sirverchats-native-linux
          path: native/build/linux/packages/*
          if-no-files-found: error
