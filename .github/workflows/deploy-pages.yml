name: Deploy React web app to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and publish React UI to app.sirverdata.top
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install React dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck React app
        run: npm run lint

      - name: Run React unit tests
        run: npm run test:unit

      - name: Build React web app
        run: npm run build

      - name: Verify React bundle budget
        run: npm run check:bundle

      - name: Ensure Cloudflare Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          project_url="${api}/sirverchats"
          status="$(curl -sS -o /tmp/sirverchats-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${project_url}")"
          if [ "${status}" = "404" ]; then
            curl -fsS -X POST "${api}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"name":"sirverchats","production_branch":"main"}' \
              >/tmp/sirverchats-project.json
          elif [ "${status}" != "200" ]; then
            echo "Cloudflare Pages project lookup failed with HTTP ${status}" >&2
            exit 1
          fi
          curl -fsS -X PATCH "${project_url}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"production_branch":"main"}' \
            >/tmp/sirverchats-project.json

      - name: Attach app.sirverdata.top to the React Pages project
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          domain='app.sirverdata.top'
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          domains_json="$(curl -fsS "${api}/sirverchats/domains" "${auth[@]}")"
          if printf '%s' "${domains_json}" | jq -e --arg domain "${domain}" '.result[]? | select(.name == $domain)' >/dev/null; then
            echo "${domain} is already attached to sirverchats"
            exit 0
          fi

          # If another Pages project owns the hostname, detach only that exact
          # hostname before restoring the React production deployment.
          owner=''
          while IFS= read -r candidate; do
            [ -n "${candidate}" ] || continue
            candidate_domains="$(curl -fsS "${api}/${candidate}/domains" "${auth[@]}")"
            if printf '%s' "${candidate_domains}" | jq -e --arg domain "${domain}" '.result[]? | select(.name == $domain)' >/dev/null; then
              owner="${candidate}"
              break
            fi
          done < <(curl -fsS "${api}?per_page=100" "${auth[@]}" | jq -r '.result[]?.name')
          if [ -n "${owner}" ] && [ "${owner}" != "sirverchats" ]; then
            echo "Moving ${domain} from Pages project ${owner} to sirverchats"
            curl -fsS -X DELETE "${api}/${owner}/domains/${domain}" "${auth[@]}" >/tmp/sirverchats-domain-delete.json
          fi
          curl -fsS -X POST "${api}/sirverchats/domains" "${auth[@]}" \
            --data "{\"name\":\"${domain}\"}" \
            >/tmp/sirverchats-domain-create.json
          echo "Attached ${domain} to sirverchats"

      - name: Route app DNS to Pages production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          zone_json="$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=sirverdata.top&status=active" "${auth[@]}")"
          zone_id="$(printf '%s' "${zone_json}" | jq -r '.result[0].id // empty')"
          [ -n "${zone_id}" ] || { echo 'sirverdata.top zone was not found' >&2; exit 1; }
          records_json="$(curl -fsS "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=app.sirverdata.top&per_page=100" "${auth[@]}")"
          printf '%s' "${records_json}" | jq '{records: [.result[]? | {id, type, name, proxied, ttl, points_to_pages: (.content == "sirverchats.pages.dev")}]}'
          record_id="$(printf '%s' "${records_json}" | jq -r '.result[]? | select(.type == "CNAME") | .id' | head -n 1)"
          if [ -n "${record_id}" ]; then
            curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" \
              "${auth[@]}" \
              --data '{"type":"CNAME","name":"app.sirverdata.top","content":"sirverchats.pages.dev","ttl":1,"proxied":true}' \
              >/tmp/sirverchats-app-dns.json
          elif [ "$(printf '%s' "${records_json}" | jq '.result | length')" = "0" ]; then
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
              "${auth[@]}" \
              --data '{"type":"CNAME","name":"app.sirverdata.top","content":"sirverchats.pages.dev","ttl":1,"proxied":true}' \
              >/tmp/sirverchats-app-dns.json
          else
            echo 'app.sirverdata.top has a non-CNAME DNS record; refusing to replace it automatically' >&2
            exit 1
          fi
          echo 'app.sirverdata.top DNS now targets sirverchats.pages.dev'

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # This is a Direct Upload project. Omitting --branch promotes the
          # upload to the production deployment used by the custom domain.
          command: pages deploy dist --project-name=sirverchats

      - name: Purge cached responses for the production hostname
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          zone_id="$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=sirverdata.top&status=active" "${auth[@]}" | jq -r '.result[0].id // empty')"
          [ -n "${zone_id}" ] || { echo 'sirverdata.top zone was not found' >&2; exit 1; }
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            "${auth[@]}" --data '{"hosts":["app.sirverdata.top"]}' \
            >/tmp/sirverchats-cache-purge.json
          echo 'Purged cached responses for app.sirverdata.top'

      - name: Verify production Pages hostname
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/sirverchats"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          project_json="$(curl -fsS "${api}" "${auth[@]}")"
          printf '%s' "${project_json}" | jq '{name: .result.name, subdomain: .result.subdomain, production_branch: .result.production_branch, latest_deployment: {id: .result.latest_deployment.id, url: .result.latest_deployment.url, environment: .result.latest_deployment.environment}}'
          curl -fsS "${api}/domains" "${auth[@]}" | jq '{domains: [.result[]? | {name, status}]}'
          for attempt in $(seq 1 12); do
            html="$(curl --retry 3 --retry-all-errors -fsS https://app.sirverdata.top/ || true)"
            if printf '%s' "${html}" | grep -q 'assets/index-' && ! printf '%s' "${html}" | grep -q 'flutter_bootstrap.js'; then
              echo 'app.sirverdata.top is serving the restored React production UI'
              exit 0
            fi
            echo "Waiting for Pages custom-domain activation (attempt ${attempt}/12)"
            sleep 10
          done
          echo 'app.sirverdata.top is not serving the restored React production UI' >&2
          exit 1
