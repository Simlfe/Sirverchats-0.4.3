name: Publish Tauri release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  web:
    name: Package React Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sirverchats-react-web
          path: dist
          if-no-files-found: error

  android:
    name: Tauri Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci --no-audit --no-fund
      - name: Build Tauri Android release artifacts
        run: npx tauri android build --ci --apk --aab --target aarch64
      - name: Rename Android artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          apk="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | sort | head -n 1)"
          aab="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' | sort | head -n 1)"
          test -n "$apk" && cp "$apk" "release-assets/sirverchats-${GITHUB_REF_NAME}-android.apk"
          test -n "$aab" && cp "$aab" "release-assets/sirverchats-${GITHUB_REF_NAME}-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: sirverchats-tauri-android
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Tauri Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --ci --no-sign --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: sirverchats-tauri-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Tauri Linux AppImage and deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools \
            libfuse2t64 || sudo apt-get install -y libfuse2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --ci --no-sign --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: sirverchats-tauri-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [web, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: find release-assets -type f -not -name SHA256SUMS -print0 | xargs -0 sha256sum > release-assets/SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
