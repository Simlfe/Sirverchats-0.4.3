# Include the maps at http scope and this server fragment inside the
# chat.sirverdata.top TLS server. The gateway listens on localhost.
map $http_origin $sirver_cors_origin {
    default "";
    "https://app.sirverdata.top" $http_origin;
    "https://sirverdata.top" $http_origin;
    "http://tauri.localhost" $http_origin;
    ~^https://([a-z0-9-]+\.)+sirverdata\.top$ $http_origin;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

location ^~ /api/v2/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $sirver_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 600 always;
        add_header Vary Origin always;
        return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Vary;
    add_header Access-Control-Allow-Origin $sirver_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary Origin always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://127.0.0.1:8080;
}

location = /livekit/token {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $sirver_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;
        return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Vary;
    add_header Access-Control-Allow-Origin $sirver_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary Origin always;
    proxy_pass http://127.0.0.1:8080/livekit/token;
}
